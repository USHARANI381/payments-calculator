<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            flex-direction: column;
        }

        #specialText {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .calculator {
            background: #ffffff;
            padding: 25px;
            border-radius: 20px;
            width: 300px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        #display {
            width: 100%;
            box-sizing: border-box;
            height: 65px;
            margin-bottom: 15px;
            font-size: 28px;
            text-align: right;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #e9ecef;
        }

        button:hover {
            opacity: 0.8;
        }

        .equals {
            grid-column: span 2;
            background: #2563eb;
            color: white;
        }

        /* Client settings panel */
        #settingsPanel {
            display: none;
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        #settingsPanel input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 8px 0 15px;
            font-size: 16px;
        }

        #settingsPanel button {
            width: 100%;
            height: 45px;
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div id="settingsPanel">
        <h3>Client Settings</h3>

        <label>Special text</label>
        <input
            type="text"
            id="textInput"
            placeholder="Enter text above calculator"
        >

        <label>Background color</label>
        <input
            type="color"
            id="backgroundInput"
            value="#141e30"
        >

        <label>Button color</label>
        <input
            type="color"
            id="buttonInput"
            value="#e9ecef"
        >

        <button onclick="saveSettings()">Save Changes</button>
    </div>

    <div id="specialText"></div>

    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('%')">%</button>
            <button onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

    </div>

<script>

    // =========================================================
    // SUPABASE CONNECTION
    // =========================================================

    const SUPABASE_URL = "https://zhjdetvehpnhngjsvreb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_QoNapA3o2-vxfxfNuQBnNg_xOsdsIVm";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // =========================================================
    // CALCULATOR
    // =========================================================

    const display = document.getElementById("display");

    function appendValue(value) {
        if (display.value === "0") {
            display.value = value;
        } else {
            display.value += value;
        }
    }

    function clearDisplay() {
        display.value = "0";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);

        if (display.value === "") {
            display.value = "0";
        }
    }

    function calculate() {
        try {
            display.value = eval(display.value);
        } catch {
            display.value = "Error";
        }
    }


    // =========================================================
    // LOAD SETTINGS
    // =========================================================

    async function loadSettings() {

        const { data, error } = await supabaseClient
            .from("site_settings")
            .select("*")
            .limit(1)
            .single();

        if (error) {
            console.error("Could not load settings:", error);
            return;
        }

        applySettings(data);
    }


    function applySettings(settings) {

        if (settings.background_color) {
            document.body.style.background =
                settings.background_color;
        }

        if (settings.title) {
            document.getElementById("specialText").textContent =
                settings.title;
        }

        if (settings.button_color) {

            document.querySelectorAll(".buttons button")
                .forEach(button => {
                    button.style.backgroundColor =
                        settings.button_color;
                });

            document.querySelector(".equals").style.backgroundColor =
                settings.button_color;
        }

        document.getElementById("textInput").value =
            settings.title || "";

        document.getElementById("backgroundInput").value =
            settings.background_color || "#141e30";

        document.getElementById("buttonInput").value =
            settings.button_color || "#e9ecef";
    }


    // =========================================================
    // SHOW SETTINGS ONLY TO LOGGED-IN USER
    // =========================================================

  async function checkUser() {

    const { data, error } = await supabaseClient.auth.getUser();

    if (error || !data.user) {
        console.log("No user is logged in.");
        return;
    }

    console.log("Logged in user:", data.user.email);

    document.getElementById("settingsPanel").style.display = "block";
}


    // =========================================================
    // SAVE SETTINGS
    // =========================================================

    async function saveSettings() {

        const title =
            document.getElementById("textInput").value;

        const backgroundColor =
            document.getElementById("backgroundInput").value;

        const buttonColor =
            document.getElementById("buttonInput").value;


        const { error } = await supabaseClient
            .from("site_settings")
            .update({
                title: title,
                background_color: backgroundColor,
                button_color: buttonColor
            })
            .not("title", "is", null);


        if (error) {

            console.error(error);

            alert("Could not save settings.");

            return;
        }

        alert("Settings updated!");

        loadSettings();
    }


    // =========================================================
    // REALTIME
    // =========================================================

    supabaseClient
        .channel("site-settings-changes")
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "site_settings"
            },
            payload => {

                console.log("Settings changed:", payload.new);

                applySettings(payload.new);
            }
        )
        .subscribe();


    // =========================================================
    // START
    // =========================================================

    loadSettings();
    checkUser();

</script>

</body>
</html>
